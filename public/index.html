<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Jornada da Aniversariante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14182e; --bg2:#22305a; --card:#fbf3dc; --ink:#2b2340; --muted:#6e6478; --rose:#c8406a; --rose2:#f0a3b8; --gold:#f2c14e; --green:#3fae6a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Nunito, system-ui, sans-serif; color:var(--ink);
    background: radial-gradient(circle at 15% 10%, #3b4f8f 0, transparent 40%), radial-gradient(circle at 85% 95%, #5a2a55 0, transparent 40%), linear-gradient(170deg, var(--bg), var(--bg2));
    display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:520px; }
  .hud { display:flex; align-items:center; gap:10px; color:#fff; font:10px 'Press Start 2P', monospace; margin-bottom:10px; }
  .bar { flex:1; height:12px; border:2px solid var(--gold); border-radius:3px; background:#0006; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--gold), #ffe08a); transition:width .5s; }
  .steps { display:flex; gap:8px; justify-content:center; margin-bottom:46px; }
  .steps span { width:38px; height:38px; display:grid; place-items:center; font-size:18px; border-radius:8px; background:#ffffff14; border:2px solid #ffffff22; filter:grayscale(1); opacity:.5; }
  .steps span.on { border-color:var(--gold); filter:none; opacity:1; box-shadow:0 0 12px var(--gold); }
  .steps span.done { filter:none; opacity:1; background:var(--green); border-color:#bff0cf; }
  .card { background:var(--card); border:3px solid var(--gold); outline:3px solid #6b4a12; border-radius:18px; padding:32px 26px 28px; box-shadow:0 30px 60px -20px #000a; text-align:center; animation:in .35s ease; }
  @keyframes in { from { opacity:0; transform:translateY(10px); } }
  .orb { width:86px; height:96px; margin:-82px auto 14px; display:grid; place-items:center; font-size:38px;
    clip-path:polygon(50% 0, 100% 14%, 100% 55%, 50% 100%, 0 55%, 0 14%);
    background:linear-gradient(160deg, #ffe08a, var(--gold) 45%, #a8741a); animation:float 3s ease-in-out infinite; }
  .orb.think { animation:float 3s ease-in-out infinite, pulse .5s ease-in-out infinite alternate; }
  @keyframes float { 50% { transform:translateY(-6px); } }
  @keyframes pulse { to { filter:brightness(1.25); } }
  .kicker { font:9px/1.6 'Press Start 2P', monospace; color:var(--rose); margin:0 0 12px; }
  h1, h2 { font-family:'Pixelify Sans', system-ui, sans-serif; font-weight:700; line-height:1.15; margin:0 0 12px; }
  h1, h2, .big { font-variant-ligatures:none; }
  h1 { font-size:36px; } h2 { font-size:27px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 18px; }
  .big { font-family:'Pixelify Sans', system-ui, sans-serif; font-size:28px; color:var(--ink); margin:6px 0 4px; font-weight:700; }
  .xp { display:inline-block; font:11px 'Press Start 2P', monospace; color:#8a5a00; background:#ffe9a8; border:2px solid var(--gold); border-radius:6px; padding:8px 10px; margin:0 4px 16px; animation:pop .4s ease; }
  .badge { font-size:54px; animation:pop .5s ease; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } 70% { transform:scale(1.15); } }
  .sub { font-size:14px; color:var(--muted); margin-bottom:20px; }
  .answers { display:grid; gap:8px; }
  .answers.row { grid-template-columns:1fr 1fr; }
  button, .btn { font:inherit; font-weight:800; border:0; border-radius:999px; padding:13px 18px; cursor:pointer; text-decoration:none; display:inline-block;
    background:#f3e6ea; color:var(--ink); transition:transform .1s, background .15s; }
  button:hover, .btn:hover { background:#f1d3dc; }
  button:active { transform:scale(.97); }
  button:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .primary { background:var(--rose); color:#fff; } .primary:hover { background:#cf416a; }
  .ghost { background:none; color:var(--muted); font-weight:600; font-size:14px; padding:8px; }
  .ghost:hover { background:none; color:var(--ink); }
  .count { font-size:13px; color:var(--muted); margin-top:14px; }
  .pick { text-align:left; }
  .pick button { width:100%; text-align:left; border-radius:16px; font-weight:600; }
  .pick small { display:block; font-weight:400; color:var(--muted); }
  textarea { width:100%; font:inherit; border:2px solid #ecd9de; border-radius:16px; padding:12px; min-height:70px; resize:vertical; background:#fff; color:var(--ink); margin-bottom:12px; }
  .summary { text-align:left; display:grid; gap:10px; margin:6px 0 20px; }
  .summary div { background:#fff; border:1px solid #f0dfe4; border-radius:16px; padding:12px 14px; }
  .summary b { display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--rose); }
  .summary i { display:block; font-style:normal; font-size:13px; color:var(--muted); }
  .actions { display:grid; gap:10px; }
  .wa { background:#25d366; color:#fff; } .wa:hover { background:#1fb857; }
  .note { font-size:12px; margin-top:14px; }
</style>
</head>

      ['Algo que você usaria no corpo, pra vestir ou se enfeitar?', 'usar'],

    maxQ:7, cands:[
      { n:'Jantar romântico, só nós dois', t:'dois sair calmo comida noite' },

      ['Prefere à noite?', 'noite'],

      ['Prefere ficar em casa?', 'casa'],
    ] },

MODS.forEach(m => m.cands.forEach(c => c.tags = new Set(c.t.split(' '))));

const ANS = [['Sim',1],['Provavelmente',.75],['Não sei',.5],['Acho que não',.25],['Não',0]];
const MIN_Q = 3, SURE = .6, MAX_WRONG = 3;

// ---- motor (puro, testável) ----
function newState(m) { return { w:m.cands.map(() => 1), asked:new Set(), wrong:0, n:0 }; }
function mass(m, st, tag) { let y = 0, all = 0; m.cands.forEach((c, i) => { all += st.w[i]; if (c.tags.has(tag)) y += st.w[i]; }); return all ? y / all : 0; }
function nextQ(m, st) {
  let best = -1, score = .02;
  m.qs.forEach(([, tag], i) => { if (st.asked.has(i)) return; const p = mass(m, st, tag), s = Math.min(p, 1 - p); if (s > score) { score = s; best = i; } });
  return best;
}
function answer(m, st, qi, a) {
  st.asked.add(qi); st.n++;
  const tag = m.qs[qi][1];
  m.cands.forEach((c, i) => { const L = c.tags.has(tag) ? a : 1 - a; st.w[i] *= .1 + .9 * L; });
}
function ranked(m, st) {
  const tot = st.w.reduce((s, x) => s + x, 0) || 1;
  return m.cands.map((c, i) => ({ i, p:st.w[i] / tot })).filter(x => st.w[x.i] > 0).sort((a, b) => b.p - a.p);
}
function shouldGuess(m, st) {
  const r = ranked(m, st);
  if (!r.length) return false;
  return (st.n >= MIN_Q && r[0].p >= SURE) || st.n >= m.maxQ || nextQ(m, st) < 0;
}
function reject(st, i) { st.w[i] = 0; st.wrong++; }

// Simula uma pessoa que responde certinho para cada candidato; deve acertar sem cair na lista.
function selfTest() {
  const fails = [];
  MODS.forEach(m => m.cands.forEach((target, ti) => {
    const st = newState(m); let found = false;
    for (let guard = 0; guard < 60 && !found && st.wrong < MAX_WRONG; guard++) {
      if (shouldGuess(m, st)) { const g = ranked(m, st)[0].i; if (g === ti) found = true; else reject(st, g); }
      else { const q = nextQ(m, st); answer(m, st, q, target.tags.has(m.qs[q][1]) ? 1 : 0); }
    }
    console.assert(found, m.key, target.n);
    if (!found) fails.push(m.key + ': ' + target.n);
  }));
  return fails.length ? fails : 'ok';
}

// ---- interface ----
const app = document.getElementById('app'), hudEl = document.getElementById('hud');
const result = {}; let mi = -1, st = null, curQ = -1, xp = 0;
const lvl = () => 1 + Math.floor(xp / 100);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));

function hud() {
  hudEl.innerHTML = `<div class="hud"><span>Nv ${lvl()}</span><div class="bar" role="progressbar" aria-valuenow="${xp % 100}" aria-valuemax="100"><i style="width:${xp % 100}%"></i></div><span>${xp} XP</span></div>
    <div class="steps" aria-hidden="true">${MODS.map((m, i) => `<span class="${i < mi ? 'done' : i === mi ? 'on' : ''}">${i < mi ? '✔' : m.emoji}</span>`).join('')}</div>`;
}
function view(html, think) { app.innerHTML = `<div class="card"><div class="orb${think ? ' think' : ''}">${mi >= 0 && mi < MODS.length ? MODS[mi].emoji : '🛡️'}</div>${html}</div>`; hud(); app.querySelector('button, .btn')?.focus(); }
function on(sel, fn) { app.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b.dataset.v)); }

function start() {
  view(`<p class="kicker">Nova aventura</p><h1>A Jornada da Aniversariante</h1>
    <p>Bem-vinda, aventureira! Seu fiel escudeiro preparou 5 missões: o filme, o dia, o banquete, o tesouro do seu aniversário e a grande celebração. Responda com sinceridade, ganhe XP e suba de nível. A cada resposta, seu escudeiro chega mais perto do que você quer.</p>
    <button class="primary">Iniciar jornada</button>`);
  on('button', nextMod);
}
function nextMod() {
  mi++;
  if (mi >= MODS.length) return finish();
  st = newState(MODS[mi]);
  const m = MODS[mi];
  view(`<p class="kicker">Missão ${mi + 1} de ${MODS.length}</p><h2>${m.missao}</h2><p><b>${m.titulo}</b><br>${m.intro}</p><button class="primary">Aceitar missão</button>`);
  on('button', () => step());
}
function step(gain) {
  const m = MODS[mi];
  if (st.wrong >= MAX_WRONG || !ranked(m, st).length) return pickList();
  if (shouldGuess(m, st)) return guess();
  curQ = nextQ(m, st);
  view(`<p class="kicker">${m.label} · pergunta ${st.n + 1}</p>${gain ? '<div class="xp">+10 XP</div>' : ''}<h2>${m.qs[curQ][0]}</h2>
    <div class="answers">${ANS.map(([t, v]) => `<button data-v="${v}">${t}</button>`).join('')}</div>
    <button class="ghost" data-skip="1">Deixa que eu escolho da lista</button>`);
  app.querySelectorAll('.answers button').forEach(b => b.onclick = () => { answer(m, st, curQ, +b.dataset.v); xp += 10; step(true); });
  app.querySelector('[data-skip]').onclick = pickList;
}
function guess() {
  const m = MODS[mi], c = m.cands[ranked(m, st)[0].i];
  view(`<p class="kicker">Seu escudeiro deduziu...</p><p>Aposto que é</p><div class="big">${esc(c.n)}</div><div class="sub">${esc(c.d || c.c || '')}</div>
    <div class="answers row"><button class="primary" data-v="1">Acertou!</button><button data-v="0">Não é isso</button></div>`, true);
  on('.answers button', v => v === '1' ? done(c, st.wrong === 0) : (reject(st, m.cands.indexOf(c)), step()));
}
function pickList() {
  const m = MODS[mi], r = ranked(m, st);
  const list = r.length ? r.map(x => m.cands[x.i]) : m.cands;
  view(`<p class="kicker">Escolha seu caminho</p><h2>Qual destes?</h2>
    <div class="answers pick">${list.map(c => `<button data-v="${m.cands.indexOf(c)}">${esc(c.n)}<small>${esc(c.d || c.c || '')}</small></button>`).join('')}</div>
    <p class="note">Nenhum? Escreva aqui:</p><textarea id="outro" aria-label="Outra resposta"></textarea><button class="primary" id="ok">Enviar</button>`);
  on('.pick button', v => done(m.cands[+v]));
  app.querySelector('#ok').onclick = () => { const v = app.querySelector('#outro').value.trim(); if (v) done({ n:v }); };
}
function done(c, critico) {
  const m = MODS[mi];
  result[m.key] = { ...c, perguntas:st.n, critico };
  if (!m.dica) return celebrate();
  view(`<p class="kicker">Tesouro encontrado!</p><div class="big">${esc(c.n)}</div><div class="sub">Categoria: ${esc(c.c || '—')}</div>
    <p>Quer deixar uma pista extra pro escudeiro? Cor, tamanho, marca, loja, modelo... (opcional)</p>
    <textarea id="dica" aria-label="Dica do presente"></textarea><button class="primary" id="ok">Continuar</button>`);
  app.querySelector('#ok').onclick = () => { result[m.key].dica = app.querySelector('#dica').value.trim(); celebrate(); };
}
function celebrate() {
  const m = MODS[mi], r = result[m.key], antes = lvl();
  const ganho = 50 + (r.critico ? 30 : 0);
  xp += ganho;
  view(`<p class="kicker">Missão cumprida!</p><div class="badge">${m.conquista[0]}</div><h2>Conquista: ${m.conquista[1]}</h2>
    <div class="xp">+${ganho} XP${r.critico ? ' · acerto crítico!' : ''}</div>${lvl() > antes ? `<div class="xp">⬆ Subiu para o nível ${lvl()}!</div>` : ''}
    <p class="sub">${m.label}: <b>${esc(r.n)}</b></p><button class="primary">${mi + 1 < MODS.length ? 'Próxima missão' : 'Abrir o baú final'}</button>`);
  on('button', nextMod);
}
function texto() {
  const r = result, p = r.presente;
  return [`🛡️ A Jornada da Aniversariante — concluída no nível ${lvl()}! O que eu quero:`,
    `🎬 Filme: ${r.filme.n}`, `📅 Dia: ${r.dia.n}`, `🍿 Comida: ${r.comida.n}`,
    `🎁 Presente: ${p.n}${p.c ? ' (' + p.c + ')' : ''}${p.dica ? ' — dica: ' + p.dica : ''}`,
    `🥳 Niver: ${r.festa.n}`].join('\n');
}
function finish() {
  const r = result, p = r.presente, t = texto();
  view(`<p class="kicker">Jornada completa · Nível ${lvl()}</p><h2>Seu inventário</h2>
    <div class="summary">
      <div><b>🎬 Filme</b>${esc(r.filme.n)}<i>Cinemark Taguatinga Shopping</i></div>
      <div><b>📅 Dia</b>${esc(r.dia.n)}</div>
      <div><b>🍿 Banquete</b>${esc(r.comida.n)}</div>
      <div><b>🎁 Tesouro</b>${esc(p.n)}${p.c ? `<i>Categoria: ${esc(p.c)}</i>` : ''}${p.dica ? `<i>Pista: ${esc(p.dica)}</i>` : ''}</div>
      <div><b>🥳 Celebração</b>${esc(r.festa.n)}</div>
    </div>
    <p class="sub">Conquistas: ${MODS.map(m => m.conquista.join(' ')).join(' · ')}</p>
    <div class="actions">
      <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">Enviar pro meu escudeiro no WhatsApp</a>
      <button id="copy">Copiar respostas</button>
      <button class="ghost" id="again">Jogar de novo</button>
    </div><p class="note" id="msg"></p>`);
  app.querySelector('#copy').onclick = async () => {
    const msg = app.querySelector('#msg');
    try { await navigator.clipboard.writeText(t); msg.textContent = 'Copiado! Agora é só colar pra ele.'; }
    catch { msg.innerHTML = `<textarea readonly>${esc(t)}</textarea>`; msg.querySelector('textarea').select(); }
  };
  app.querySelector('#again').onclick = () => { mi = -1; xp = 0; start(); };
}
start();
</script>
</body>
</html>
